<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- SweetAlert2 CSS y JS -->
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>Orange Admin</h4>
    <a href="#" onclick="cargarVista('dashboard')">📊 Dashboard</a>
    <a href="#" onclick="cargarVista('contratistas')">Contratistas</a>
    <a href="#" onclick="cargarVista('conductores')">Conductores</a>
    <a href="#" onclick="cargarVista('vehiculos')">Vehículos</a>
    <a href="#" onclick="cargarVista('solicitudes')">📋 Solicitudes Pendientes</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h3 id="titulo">Dashboard</h3>
        <div id="usuario">Usuario Sistemas</div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div id="contenido"></div>
        
        <!-- ========================================== -->
        <!-- MODAL EDITAR CONDUCTOR -->
        <!-- ========================================== -->
        <div class="modal fade" id="modalEditar" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Conductor</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input id="edit_nombre" class="form-control mb-2" placeholder="Nombre">
                        <input id="edit_cedula" class="form-control mb-2" placeholder="Cédula">
                        <input id="edit_email" class="form-control mb-2" placeholder="Email">
                        <select id="edit_contratista_conductor" class="form-control mb-2"></select>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-success" onclick="guardarEdicion()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODAL EDITAR CONTRATISTA -->
        <!-- ========================================== -->
        <div class="modal fade" id="modalEditarContratista" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Contratista</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input id="edit_nombre_contratista" class="form-control mb-2" placeholder="Nombre">
                        <input id="edit_nit_contratista" class="form-control mb-2" placeholder="NIT">
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-success" onclick="guardarEdicionContratista()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- MODAL EDITAR VEHÍCULO -->
        <!-- ========================================== -->
        <div class="modal fade" id="modalEditarVehiculo" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-white">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Vehículo</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input id="edit_placa" class="form-control mb-2" placeholder="Placa">
                        <input id="edit_marca" class="form-control mb-2" placeholder="Marca">
                        <input id="edit_modelo" class="form-control mb-2" placeholder="Modelo">
                        <select id="edit_contratista" class="form-control mb-2"></select>
                        <select id="edit_conductor" class="form-control mb-2"></select>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-success" onclick="guardarEdicionVehiculo()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <!-- FIN CONTENT -->
    <!-- FOOTER -->
<div class="footer mt-4 p-3 text-center" style="border-top: 1px solid #1f2937; color: #6c757d; font-size: 12px;">
    <span>© 2024 Orange Admin - Sistema de Gestión de Transporte</span>
</div>

</div>
<!-- FIN MAIN -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/selects.js"></script>
<script src="js/contratistas.js"></script>
<script src="js/conductores.js"></script>
<script src="js/vehiculos.js"></script>
<script src="js/solicitudes.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
