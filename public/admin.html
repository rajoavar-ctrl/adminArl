<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #0f172a;
    color: white;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #111827;
    position: fixed;
    top: 0;
    left: 0;
}

.sidebar h4 {
    padding: 20px;
    color: #f97316;
}

.sidebar a {
    display: block;
    padding: 12px 20px;
    color: #9ca3af;
    text-decoration: none;
}

.sidebar a:hover {
    background: #1f2937;
    color: white;
}

/* MAIN */
.main {
    margin-left: 250px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* HEADER */
.header {
    padding: 20px 30px;
    border-bottom: 1px solid #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* CONTENT */
.content {
    flex: 1;
    padding: 30px;
}

/* CARDS */
.card {
    background: #111827;
    border: 1px solid #1f2937;
    color: white;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>Orange Admin</h4>

    <a href="#" onclick="cargarVista('contratistas')">Contratistas</a>
    <a href="#" onclick="cargarVista('conductores')">Conductores</a>
    <a href="#" onclick="cargarVista('vehiculos')">Vehículos</a>
</div>

<!-- MAIN -->
<div class="main">

    <!-- HEADER -->
    <div class="header">
        <h3 id="titulo">Dashboard</h3>
        <div>Usuario Sistemas</div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div id="contenido"></div>
    </div>

</div>

<!-- SCRIPT (EL QUE YA TIENES FUNCIONANDO) -->
<script>

function fetchJSON(url, options = {}) {
    return fetch(url, options)
    .then(async res => {
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            console.error('❌ RESPUESTA INVALIDA:', text);
            return [];
        }
    })
    .catch(err => {
        console.error('❌ ERROR FETCH:', err);
        return [];
    });
}

function cargarVista(vista) {

    document.getElementById('titulo').innerText = vista.toUpperCase();

    fetch(`/orange-proyect/public/views/${vista}.html`)
    .then(res => res.text())
    .then(html => {

        document.getElementById('contenido').innerHTML = html;
        initVista(vista);
    });
}

function initVista(vista) {

    if (vista === 'contratistas') {
        cargarContratistas();
    }

    if (vista === 'conductores') {
        cargarContratistasSelect();
        cargarConductores();
    }

    if (vista === 'vehiculos') {
        cargarContratistasSelect();
        cargarVehiculos();
        activarFiltroConductores();
    }
}

/* CONTRATISTAS */
function cargarContratistas() {
    fetchJSON('/orange-proyect/public/contratistas')
    .then(data => {
        const c = document.getElementById('contenido');
        c.querySelector('#tablaContratistas').innerHTML =
            data.map(x => `<tr><td>${x.nombre}</td><td>${x.nit}</td></tr>`).join('');
        c.querySelector('#totalContratistas').textContent = data.length;
    });
}

/* CONDUCTORES */
function cargarConductores() {
    fetchJSON('/orange-proyect/public/conductores')
    .then(data => {
        const c = document.getElementById('contenido');
        c.querySelector('#tablaConductores').innerHTML =
            data.map(x => `<tr><td>${x.nombre}</td><td>${x.cedula}</td><td>${x.empresa}</td></tr>`).join('');
        c.querySelector('#totalConductores').textContent = data.length;
    });
}

/* VEHICULOS */
function cargarVehiculos() {
    fetchJSON('/orange-proyect/public/vehiculos')
    .then(data => {
        const c = document.getElementById('contenido');
        c.querySelector('#tablaVehiculos').innerHTML =
            data.map(x => `<tr><td>${x.placa}</td><td>${x.marca}</td><td>${x.modelo}</td><td>${x.empresa}</td></tr>`).join('');
        c.querySelector('#totalVehiculos').textContent = data.length;
    });
}

/* SELECTS */
function cargarContratistasSelect() {
    fetchJSON('/orange-proyect/public/contratistas')
    .then(data => {
        const select = document.querySelector('#contenido #contratista');
        if (!select) return;

        select.innerHTML =
            '<option value="">Seleccione empresa</option>' +
            data.map(x => `<option value="${x.id}">${x.nombre}</option>`).join('');
    });
}

function activarFiltroConductores() {

    const select = document.querySelector('#contenido #contratista');

    if (!select) return;

    select.onchange = function() {

        fetchJSON(`/orange-proyect/public/conductores/por-contratista?contratista_id=${this.value}`)
        .then(data => {

            const selectCond = document.querySelector('#contenido #conductor');

            if (!selectCond) return;

            selectCond.innerHTML =
                '<option value="">Seleccione conductor</option>' +
                data.map(x => `<option value="${x.id}">${x.nombre}</option>`).join('');
        });
    };
}

/* INICIO */
cargarVista('contratistas');

</script>

</body>
</html>
