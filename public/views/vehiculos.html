<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Vehículos</h6>
                <h3 id="totalVehiculos">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO MÁS PEQUEÑO -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Vehículo</h4>

                <input id="placa" class="form-control mb-2" placeholder="Placa Vehiculo">
                <input id="marca" class="form-control mb-2" placeholder="Marca">
                <input id="modelo" class="form-control mb-2" placeholder="Modelo (Año)">
                
                <select id="contratista" class="form-control mb-2">
                    <option value="">Seleccione una empresa</option>
                </select>
                
                <select id="conductor" class="form-control mb-3">
                    <option value="">Seleccione un conductor </option>
                </select>

                <button class="btn btn-primary w-100" onclick="crearVehiculo()">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA MÁS GRANDE -->
         
        <div class="col-md-8">
            <div class="card p-1">
                <h4>Listado de Vehículos</h4>

                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Empresa</th>
                                <th>Conductor</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVehiculos">
                            <tr>
                                <td colspan="6" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
