<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Vehículos</h6>
                <h3 id="totalVehiculos">0</h3>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-3">
                <div class="row align-items-end">
                    <div class="col-md-3">
                        <label class="form-label text-muted">🔍 Buscar</label>
                        <input type="text" id="searchVehiculo" class="form-control" placeholder="Buscar...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted">🏢 Empresa</label>
                        <select id="empresaFiltroVehiculo" class="form-control">
                            <option value="">Todas las empresas</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted">👨 Conductor</label>
                        <select id="conductorFiltroVehiculo" class="form-control">
                            <option value="">Todos los conductores</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="aplicarFiltrosVehiculos()">
                            🔍 Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Vehículo</h4>

                <input id="placa" class="form-control mb-2" placeholder="Placa">
                <input id="marca" class="form-control mb-2" placeholder="Marca">
                <input id="modelo" class="form-control mb-2" placeholder="Modelo">
                
                <select id="contratista" class="form-control mb-2">
                    <option value="">Seleccione una empresa</option>
                </select>
                
                <select id="conductor" class="form-control mb-2">
                    <option value="">Seleccione un conductor</option>
                </select>

                <button class="btn btn-primary w-100 mt-2" onclick="crearVehiculo()">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-8">
            <div class="card p-4">
                <h4>Listado de Vehículos</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Placa</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Empresa</th>
                                <th>Conductor</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVehiculos">
                            <tr>
                                <td colspan="6" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- PAGINACIÓN -->
                <div id="paginacion-vehiculos" class="d-flex justify-content-center mt-3"></div>
            </div>
        </div>

    </div>
</div>
