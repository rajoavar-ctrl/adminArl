<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Vehículos</h6>
                <h3 id="totalVehiculos">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORM -->
        <div class="col-md-5">
            <div class="card p-4">
                <h4>Registrar Vehículo</h4>

                <input id="placa" class="form-control mb-2" placeholder="Placa">
                <input id="marca" class="form-control mb-2" placeholder="Marca">
                <input id="modelo" class="form-control mb-2" placeholder="Modelo">

                <select id="contratista" class="form-control mb-2"></select>
                <select id="conductor" class="form-control mb-3"></select>

                <button class="btn btn-primary w-100" onclick="crearVehiculo()">
                    Guardar
                </button>

                <p id="mensaje"></p>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-7">
            <div class="card p-4">
                <h4>Listado</h4>

                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Empresa</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVehiculos"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>
