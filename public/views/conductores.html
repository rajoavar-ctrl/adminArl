<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Conductores</h6>
                <h3 id="totalConductores">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO MÁS PEQUEÑO - col-md-4 en lugar de col-md-5 -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Conductor</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre Conductor">
                <input id="cedula" class="form-control mb-2" placeholder="Cedula">
                <input id="email" class="form-control mb-2" placeholder="Correo Electrónico">
                <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña (mínimo 6 caracteres)">

                <select id="contratista" class="form-control mb-3">
                    <option value="">Seleccione una empresa</option>
                </select>

                <button onclick="crearConductor()" class="btn btn-primary w-100">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA MÁS GRANDE - col-md-8 en lugar de col-md-7 -->
        <div class="col-md-8">
            <div class="card p-1">
                <h4>Listado de Conductores</h4>

                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Email</th>
                                <th>Empresa</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConductores">
                            <tr>
                                <td colspan="5" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
