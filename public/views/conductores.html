<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Conductores</h6>
                <h3 id="totalConductores">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORM -->
        <div class="col-md-5">
            <div class="card p-4">
                <h4>Registrar Conductor</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre">
                <input id="cedula" class="form-control mb-2" placeholder="Cédula">
                <input id="email" class="form-control mb-2" placeholder="Email">
                <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña">

                <select id="contratista" class="form-control mb-3"></select>

                <button class="btn btn-primary w-100" onclick="crearConductor()">
                    Guardar
                </button>

                <p id="mensaje"></p>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-7">
            <div class="card p-4">
                <h4>Listado</h4>

                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Cédula</th>
                            <th>Empresa</th>
                        </tr>
                    </thead>
                    <tbody id="tablaConductores"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>
