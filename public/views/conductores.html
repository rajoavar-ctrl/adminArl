<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Conductores</h6>
                <h3 id="totalConductores">0</h3>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-3">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label class="form-label text-muted">🔍 Buscar</label>
                        <input type="text" id="searchConductor" class="form-control" placeholder="Buscar por nombre, cédula o email...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted">🏢 Empresa</label>
                        <select id="empresaFiltro" class="form-control">
                            <option value="">Todas las empresas</option>
                        </select>
                    </div>
                  
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Conductor</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre">
                <input id="cedula" class="form-control mb-2" placeholder="Cédula">
                <input id="email" class="form-control mb-2" placeholder="Email">
                <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña">

                <select id="contratista" class="form-control mb-2">
                    <option value="">Seleccione una empresa</option>
                </select>

                <button class="btn btn-primary w-100 mt-2" onclick="crearConductor()">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-8">
            <div class="card p-4">
                <h4>Listado de Conductores</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Email</th>
                                <th>Empresa</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConductores">
                            <tr>
                                <td colspan="5" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- PAGINACIÓN -->
                <div id="paginacion-conductores" class="d-flex justify-content-center mt-3"></div>
            </div>
        </div>

    </div>
</div>
