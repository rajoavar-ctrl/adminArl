<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Contratista - Orange Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .register-container { width: 100%; max-width: 650px; margin: auto; }
        .register-card {
            background: #111827;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid #1f2937;
        }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header h1 { color: #f97316; font-size: 2rem; font-weight: 700; }
        .register-header p { color: #9ca3af; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { color: #9ca3af; margin-bottom: 8px; display: block; font-size: 0.85rem; }
        .form-control {
            background: #1f2937;
            border: 1px solid #374151;
            color: white;
            border-radius: 10px;
            padding: 12px 15px;
            width: 100%;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }
        .btn-register {
            background: #f97316;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-register:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }
        .login-link { text-align: center; margin-top: 20px; color: #9ca3af; }
        .login-link a { color: #f97316; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .info-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        .info-box i { color: #f97316; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <span style="font-size: 3rem;">🏢</span>
                <h1>Registro de Contratista</h1>
                <p>Registra tu empresa para operar en el sistema</p>
            </div>

            <div class="info-box">
                <i>📌</i> Al registrarte, tu solicitud será revisada por el administrador. 
                Recibirás un correo de confirmación cuando sea aprobada.
            </div>

            <form id="registroForm">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label>🏢 Nombre de la Empresa</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej: Transportes del Sur SAS" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>📄 NIT</label>
                            <input type="text" id="nit" class="form-control" placeholder="Ej: 900123456-1" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>📞 Teléfono</label>
                            <input type="tel" id="telefono" class="form-control" placeholder="Ej: 3001234567" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label>📍 Dirección</label>
                            <input type="text" id="direccion" class="form-control" placeholder="Ej: Calle 123 #45-67" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label>📧 Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" placeholder="Ej: contacto@transportes.com" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>🔒 Contraseña</label>
                            <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>🔒 Confirmar Contraseña</label>
                            <input type="password" id="confirm_password" class="form-control" placeholder="Repite tu contraseña" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">Registrar Empresa</button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta aprobada? <a href="/orange-proyect/public/views/login_contratista.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const nit = document.getElementById('nit').value;
            const direccion = document.getElementById('direccion').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!nombre || !nit || !direccion || !telefono || !email || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Todos los campos son obligatorios',
                    background: '#111827',
                    color: 'white',
                    confirmButtonColor: '#f97316'
                });
                return;
            }

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Contraseñas no coinciden',
                    text: 'Las contraseñas deben ser iguales',
                    background: '#111827',
                    color: 'white',
                    confirmButtonColor: '#f97316'
                });
                return;
            }

            if (password.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Contraseña muy corta',
                    text: 'La contraseña debe tener al menos 6 caracteres',
                    background: '#111827',
                    color: 'white',
                    confirmButtonColor: '#f97316'
                });
                return;
            }

            Swal.fire({
                title: 'Registrando...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const response = await fetch('/orange-proyect/public/contratistas/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, nit, direccion, telefono, email, password })
                });

                const data = await response.json();

                if (data.error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.error,
                        background: '#111827',
                        color: 'white',
                        confirmButtonColor: '#f97316'
                    });
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Registro exitoso!',
                        text: 'Tu solicitud ha sido enviada. Espera la aprobación del administrador.',
                        background: '#111827',
                        color: 'white',
                        confirmButtonColor: '#f97316'
                    }).then(() => {
                        document.getElementById('registroForm').reset();
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Error de conexión',
                    background: '#111827',
                    color: 'white',
                    confirmButtonColor: '#f97316'
                });
            }
        });
    </script>
</body>
</html>
