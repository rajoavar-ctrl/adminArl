<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Contratistas</h6>
                <h3 id="totalContratistas">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO MÁS PEQUEÑO -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Contratista</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre Empresa">
                <input id="nit" class="form-control mb-3" placeholder="NIT Empresa">

                <button class="btn btn-primary w-100" onclick="crearContratista()">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA MÁS GRANDE -->
        <div class="col-md-8">
            <div class="card p-4">
                <h4>Listado de Contratistas</h4>

                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaContratistas">
                            <tr>
                                <td colspan="3" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
