<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Contratistas</h6>
                <h3 id="totalContratistas">0</h3>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORM -->
        <div class="col-md-5">
            <div class="card p-4">
                <h4>Registrar Contratista</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre empresa">
                <input id="nit" class="form-control mb-3" placeholder="NIT">

                <button class="btn btn-primary w-100" onclick="crearContratista()">
                    Guardar
                </button>

                <p id="mensaje"></p>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-7">
            <div class="card p-4">
                <h4>Listado</h4>

                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>NIT</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContratistas"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>
