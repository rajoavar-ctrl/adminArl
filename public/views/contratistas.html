<div class="container mt-5">

    <!-- CONTADOR -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 bg-dark text-white">
                <h6>Contratistas</h6>
                <h3 id="totalContratistas">0</h3>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-3">
                <div class="row align-items-end">
                    <div class="col-md-9">
                        <label class="form-label text-muted">🔍 Buscar contratista</label>
                        <input type="text" id="searchContratista" class="form-control" placeholder="Buscar por nombre o NIT...">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="aplicarFiltrosContratistas()">
                            🔍 Filtrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <!-- FORMULARIO -->
        <div class="col-md-4">
            <div class="card p-4">
                <h4>Registrar Contratista</h4>

                <input id="nombre" class="form-control mb-2" placeholder="Nombre Empresa">
                <input id="nit" class="form-control mb-2" placeholder="NIT">

                <button class="btn btn-primary w-100 mt-3" onclick="crearContratista()">
                    Guardar
                </button>

                <div id="mensaje" class="mt-2"></div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="col-md-8">
            <div class="card p-4">
                <h4>Listado de Contratistas</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>NIT</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaContratistas">
                            <tr>
                                <td colspan="3" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- PAGINACIÓN -->
                <div id="paginacion-contratistas" class="d-flex justify-content-center mt-3"></div>
            </div>
        </div>

    </div>
</div>
